<!DOCTYPE html>
<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->

  <!-- Chart.js -->

  <style>
    /* Base Typography & Smooth Scrolling */
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
    }

    /* Theme 1: Pure White Minimal (Apple / Notion inspired) */
    body[data-theme="pure_white"] {
      --bg-app: #f8fafc;
      --bg-gradient: radial-gradient(circle at top right, #ffffff 0%, #f1f5f9 100%);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(226, 232, 240, 0.9);
      --glass-shadow: 0 8px 30px rgba(15, 23, 42, 0.04);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #0f172a;
      --accent-soft: #f1f5f9;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
    }

    /* Theme 2: White + Soft Yellow + Neon Orange */
    body[data-theme="warm_neon"] {
      --bg-app: #fffdf5;
      --bg-gradient: radial-gradient(circle at top left, #fef9c3 0%, #fffbeb 45%, #ffffff 100%);
      --glass-bg: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(253, 224, 71, 0.55);
      --glass-shadow: 0 10px 30px rgba(249, 115, 22, 0.08);
      --text-primary: #1c1917;
      --text-secondary: #78716c;
      --accent: #ff5500;
      --accent-soft: #ffedd5;
      --accent-text: #ffffff;
      --input-bg: #ffffff;
    }

    /* Theme 3: Premium Dark Glass */
    body[data-theme="dark_glass"] {
      --bg-app: #090d16;
      --bg-gradient: radial-gradient(circle at top right, #1e293b 0%, #090d16 60%, #020617 100%);
      --glass-bg: rgba(15, 23, 42, 0.72);
      --glass-border: rgba(148, 163, 184, 0.16);
      --glass-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --accent-text: #0f172a;
      --input-bg: rgba(30, 41, 59, 0.85);
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
    }

    .glass-input {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
    }
    .glass-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .btn-accent {
      background: var(--accent);
      color: var(--accent-text);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-accent:hover { opacity: 0.92; }
    .btn-accent:active { transform: scale(0.97); }

    .text-muted { color: var(--text-secondary); }

    .nav-item.active {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }

    /* Print Styles for PDF Export */
    @media print {
      aside, nav, #mobile-bottom-nav, .no-print { display: none !important; }
      main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
      .glass-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; break-inside: avoid; }
    }
  </style>
</head>
<body data-theme="pure_white" class="min-h-screen flex flex-col lg:flex-row">

  <!-- Firebase + Core Application Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // 1. DEFAULT ZERO-BALANCE STATE (No Fake/Demo Data)
    // =========================================================================
    function createInitialState() {
      return {
        settings: {
          usdToBdtRate: 126.50,
          monthlyExpenseLimitBdt: 0,
          tradingMode: false,
          theme: 'pure_white',
          hideBalance: false,
          pin: '',
          aiLanguage: 'banglish',
          customGeminiKey: ''
        },
        accounts: [
          // BDT Solid Cash Accounts (All start at 0)
          { id: 'acc_bank', name: 'Bank Account', type: 'SOLID_CASH', currency: 'BDT', openingBalance: 0, balance: 0, icon: 'landmark' },
          { id: 'acc_bkash', name: 'bKash', type: 'SOLID_CASH', currency: 'BDT', openingBalance: 0, balance: 0, icon: 'smartphone' },
          { id: 'acc_nagad', name: 'Nagad', type: 'SOLID_CASH', currency: 'BDT', openingBalance: 0, balance: 0, icon: 'smartphone' },
          { id: 'acc_rocket', name: 'Rocket', type: 'SOLID_CASH', currency: 'BDT', openingBalance: 0, balance: 0, icon: 'rocket' },
          { id: 'acc_moneybag', name: 'Money Bag / Wallet', type: 'SOLID_CASH', currency: 'BDT', openingBalance: 0, balance: 0, icon: 'briefcase' },
          { id: 'acc_cash', name: 'Physical Cash (Nogod)', type: 'SOLID_CASH', currency: 'BDT', openingBalance: 0, balance: 0, icon: 'banknote' },
          // USD / USDT Trading Accounts (All start at 0)
          { id: 'acc_binance', name: 'Binance', type: 'TRADING', currency: 'USDT', openingBalance: 0, balance: 0, icon: 'coins' },
          { id: 'acc_bybit', name: 'Bybit', type: 'TRADING', currency: 'USDT', openingBalance: 0, balance: 0, icon: 'coins' },
          { id: 'acc_okx', name: 'OKX', type: 'TRADING', currency: 'USDT', openingBalance: 0, balance: 0, icon: 'coins' },
          { id: 'acc_bitget', name: 'Bitget', type: 'TRADING', currency: 'USDT', openingBalance: 0, balance: 0, icon: 'coins' },
          { id: 'acc_metamask', name: 'MetaMask', type: 'TRADING', currency: 'USDT', openingBalance: 0, balance: 0, icon: 'shield' },
          { id: 'acc_web3', name: 'Web3 Wallet', type: 'TRADING', currency: 'USDT', openingBalance: 0, balance: 0, icon: 'globe' }
        ],
        trading: {
          openingCapitalUsdt: 0,
          additionalDepositsUsdt: 0,
          withdrawalsUsdt: 0,
          snapshots: [], // { id, date, capitalUsdt, changeUsdt, notes }
          trades: []     // { id, exchange, pair, side, entryPrice, exitPrice, qty, fee, sl, tp, status, notes, date }
        },
        livePrices: {
          BTC: { price: 0, manual: false, updated: null },
          ETH: { price: 0, manual: false, updated: null },
          BNB: { price: 0, manual: false, updated: null },
          SOL: { price: 0, manual: false, updated: null },
          USDT: { price: 1.00, manual: false, updated: null }
        },
        incomeCategories: [
          'Freelancing / Client', 'Salary / Job', 'Business / Dokan', 'Trading',
          'Trading Profit Withdrawal', 'Airdrop', 'Booster', 'Event', 'VISA',
          'Tuition / Part-time', 'Family / Gift', 'Others'
        ],
        expenseCategories: [
          'Food & Dining', 'Transport', 'Bills & Recharge', 'Shopping',
          'Family / Health', 'Entertainment / Others', 'Bike - Fuel',
          'Bike - Servicing', 'Internet - Phone', 'Internet - WiFi',
          'Ahad Ali Store', 'Hatkoroj'
        ],
        pendingIncomes: [], // { id, title, category, amount, currency, expectedDate, status, notes }
        hardAssets: [],     // { id, name, category, purchasePrice, resaleValue, status, soldPrice, soldDate, notes }
        investments: [],    // { id, name, type, invested, currentValue, currency, status }
        loans: [],          // { id, type: 'RECEIVABLE'|'LIABILITY', person, principal, remaining, currency, dueDate, status, notes }
        goals: [],          // { id, name, target, saved, currency, targetDate }
        recurringBills: [
          { id: 'bill_wifi', name: 'WiFi Bill', amount: 0, frequency: 'Monthly', dueDay: 5, lastPaid: null },
          { id: 'bill_phone', name: 'Phone Internet Package', amount: 0, frequency: 'Monthly', dueDay: 10, lastPaid: null }
        ],
        reconciliations: [], // { id, accountId, systemBalance, actualBalance, difference, status, date, notes }
        dailyCheckins: [],   // { id, date, totalNetWorthBdt, solidCashBdt, tradingUsdt, notes }
        ledger: [],          // Immutable central ledger
        aiChat: []           // { role: 'user'|'assistant', text: string, time: string }
      };
    }

    let state = createInitialState();
    let currentTab = 'dashboard';
    let chartInstances = {};
    let db = null;
    let auth = null;
    let currentUser = null;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'networth-rq-app';

    // =========================================================================
    // 2. FIREBASE CLOUD PERSISTENCE (Strict Auth & Path Rules)
    // =========================================================================
    async function initCloudPersistence() {
      const badge = document.getElementById('sync-badge');
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          badge.textContent = 'Session Mode';
          badge.className = 'text-[10px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-600 font-semibold';
          return;
        }
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }

        if (!currentUser) return;
        const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'networth_data', 'state');
        const snap = await getDoc(docRef);
        if (snap.exists()) {
          const loaded = JSON.parse(snap.data().payload);
          state = { ...createInitialState(), ...loaded };
          applyTheme(state.settings.theme, false);
          if (state.settings.pin) {
            document.getElementById('header-lock-btn').classList.remove('hidden');
          }
        }
        badge.textContent = 'Cloud Synced';
        renderApp();
      } catch (err) {
        console.error('Cloud sync init error:', err);
        badge.textContent = 'Offline Mode';
        badge.className = 'text-[10px] px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-500 font-semibold';
      }
    }

    async function persistState() {
      if (!db || !currentUser) return;
      const badge = document.getElementById('sync-badge');
      try {
        badge.textContent = 'Saving...';
        const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'networth_data', 'state');
        await setDoc(docRef, {
          payload: JSON.stringify(state),
          updatedAt: new Date().toISOString()
        });
        badge.textContent = 'Cloud Synced';
      } catch (err) {
        console.error('Save error:', err);
        badge.textContent = 'Sync Error';
      }
    }

    // =========================================================================
    // 3. FINANCIAL CALCULATION ENGINES (Strict Accounting Integrity)
    // =========================================================================
    const round2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    const round6 = (n) => Math.round((Number(n) + Number.EPSILON) * 1000000) / 1000000;

    function computeMetrics() {
      const rate = Number(state.settings.usdToBdtRate) || 126.50;

      // A. Solid Cash (BDT accessible accounts only)
      const solidCashAccounts = state.accounts.filter(a => a.type === 'SOLID_CASH');
      const solidCashBdt = round2(solidCashAccounts.reduce((s, a) => s + Number(a.balance), 0));

      // B. Trading Capital (USD/USDT accounts only)
      const tradingAccounts = state.accounts.filter(a => a.type === 'TRADING');
      const currentTradingUsdt = round2(tradingAccounts.reduce((s, a) => s + Number(a.balance), 0));
      const tradingCapitalBdt = round2(currentTradingUsdt * rate);

      // Cash-Flow-Adjusted Trading PnL
      const openingCap = Number(state.trading.openingCapitalUsdt) || 0;
      const deposits = Number(state.trading.additionalDepositsUsdt) || 0;
      const withdrawals = Number(state.trading.withdrawalsUsdt) || 0;
      const netExternalCashFlow = round2(deposits - withdrawals);
      const tradingPnlUsdt = round2(currentTradingUsdt - openingCap - netExternalCashFlow);
      const tradingPnlPct = openingCap > 0 ? round2((tradingPnlUsdt / openingCap) * 100) : 0;
      const tradingPnlBdt = round2(tradingPnlUsdt * rate);

      // C. Hard Assets (Owned only — sold assets excluded)
      const ownedHardAssetsBdt = round2(
        state.hardAssets.filter(a => a.status === 'OWNED').reduce((s, a) => s + Number(a.resaleValue), 0)
      );

      // Investments (Active only)
      const activeInvestmentsBdt = round2(
        state.investments.filter(i => i.status === 'ACTIVE').reduce((s, i) => {
          const val = Number(i.currentValue);
          return s + (i.currency === 'BDT' ? val : val * rate);
        }, 0)
      );

      // Loans: Receivables & Liabilities
      const receivablesBdt = round2(
        state.loans.filter(l => l.type === 'RECEIVABLE' && l.status !== 'SETTLED').reduce((s, l) => {
          const rem = Number(l.remaining);
          return s + (l.currency === 'BDT' ? rem : rem * rate);
        }, 0)
      );
      const liabilitiesBdt = round2(
        state.loans.filter(l => l.type === 'LIABILITY' && l.status !== 'SETTLED').reduce((s, l) => {
          const rem = Number(l.remaining);
          return s + (l.currency === 'BDT' ? rem : rem * rate);
        }, 0)
      );

      // D. Total Net Worth (No double counting, excludes pending income)
      const totalNetWorthBdt = round2(
        solidCashBdt + tradingCapitalBdt + ownedHardAssetsBdt + activeInvestmentsBdt + receivablesBdt - liabilitiesBdt
      );
      const totalNetWorthUsd = rate > 0 ? round2(totalNetWorthBdt / rate) : 0;

      // Current Month Income & Expense
      const now = new Date();
      const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const monthlyIncomeBdt = round2(
        state.ledger.filter(l => l.type === 'INCOME' && l.date.startsWith(ym))
          .reduce((s, l) => s + (l.currency === 'BDT' ? Number(l.netAmount) : Number(l.netAmount) * rate), 0)
      );
      const monthlyExpenseBdt = round2(
        state.ledger.filter(l => l.type === 'EXPENSE' && l.date.startsWith(ym))
          .reduce((s, l) => s + (l.currency === 'BDT' ? Number(l.originalAmount) + Number(l.fee) : (Number(l.originalAmount) + Number(l.fee)) * rate), 0)
      );

      return {
        rate, solidCashBdt, currentTradingUsdt, tradingCapitalBdt,
        openingCap, deposits, withdrawals, netExternalCashFlow,
        tradingPnlUsdt, tradingPnlPct, tradingPnlBdt,
        ownedHardAssetsBdt, activeInvestmentsBdt, receivablesBdt, liabilitiesBdt,
        totalNetWorthBdt, totalNetWorthUsd, monthlyIncomeBdt, monthlyExpenseBdt
      };
    }

    // Formatters with Hide Balance Support
    function fmtBDT(val) {
      if (state.settings.hideBalance) return '৳••••••';
      const n = Number(val) || 0;
      const sign = n < 0 ? '-' : '';
      return `${sign}৳${Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function fmtUSD(val, suffix = 'USDT') {
      if (state.settings.hideBalance) return '$••••••';
      const n = Number(val) || 0;
      const sign = n < 0 ? '-' : '';
      return `${sign}$${Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}${suffix ? ' ' + suffix : ''}`;
    }

    function fmtCurrency(val, currency) {
      return currency === 'BDT' ? fmtBDT(val) : fmtUSD(val, currency);
    }

      state.accounts.push({ id, name, type, currency, openingBalance: bal, balance: bal, icon: type === 'SOLID_CASH' ? 'wallet' : 'coins' });
      if (bal !== 0) {
        addLedgerRecord({ type: 'OPENING_BALANCE', destAccountId: id, originalAmount: bal, netAmount: bal, fee: 0, currency, description: `Opening balance for ${name}` });
      }
      persistState();
      closeModal();
      renderApp();
      showToast(`Account "${name}" created`);
    };

    window.openReconcileModal = (preselectedId = '') => {
      const opts = state.accounts.map(a => `<option value="${a.id}" ${a.id === preselectedId ? 'selected' : ''}>${a.name} (${a.currency} ${a.balance})</option>`).join('');
      openModal('Balance Reconciliation Engine', `
        <p class="text-xs text-muted">Compare system balance against your actual external balance. Adjustments require confirmation and create an auditable ledger record.</p>
        <div><label class="text-xs font-semibold">Select Account</label><select id="rec-acc" onchange="updateRecPreview()" class="glass-input w-full px-3 py-2 rounded-xl mt-1">${opts}</select></div>
        <div><label class="text-xs font-semibold">Actual External Balance</label><input id="rec-actual" type="number" step="0.01" oninput="updateRecPreview()" class="glass-input w-full px-3 py-2 rounded-xl mt-1" placeholder="Enter exact balance in your app/wallet" /></div>
        <div id="rec-preview" class="p-3 rounded-xl bg-slate-500/10 text-xs font-semibold">Enter actual balance to check discrepancy.</div>
        <div><label class="text-xs font-semibold">Reason / Notes</label><input id="rec-notes" class="glass-input w-full px-3 py-2 rounded-xl mt-1" placeholder="e.g., Missed small fee / Cash count check" /></div>
        <button onclick="confirmReconciliation()" class="btn-accent w-full py-2.5 rounded-xl font-semibold">Confirm & Post Reconciliation</button>
      `);
    };

    window.updateRecPreview = () => {
      const acc = state.accounts.find(a => a.id === document.getElementById('rec-acc').value);
      const actual = parseFloat(document.getElementById('rec-actual').value);
      const box = document.getElementById('rec-preview');
      if (!acc || isNaN(actual)) { box.textContent = 'Enter actual balance to check discrepancy.'; return; }
      const diff = round2(actual - acc.balance);
      if (diff === 0) {
        box.innerHTML = `<span class="text-emerald-500">Status: RECONCILED (Difference: 0)</span>`;
      } else {
        box.innerHTML = `<span class="text-amber-500">Warning: Discrepancy of ${diff > 0 ? '+' : ''}${diff} ${acc.currency}. Posting will create a BALANCE_ADJUSTMENT ledger entry.</span>`;
      }
    };

    window.confirmReconciliation = () => {
      const acc = state.accounts.find(a => a.id === document.getElementById('rec-acc').value);
      const actual = parseFloat(document.getElementById('rec-actual').value);
      const notes = document.getElementById('rec-notes').value.trim() || 'Manual reconciliation';
      if (!acc || isNaN(actual)) return showToast('Enter valid actual balance', 'error');

      const sys = acc.balance;
      const diff = round2(actual - sys);
      const status = diff === 0 ? 'RECONCILED' : 'DISCREPANCY_ADJUSTED';

      if (diff !== 0) {
        acc.balance = round2(actual);
        addLedgerRecord({
          type: 'BALANCE_ADJUSTMENT',
          destAccountId: acc.id,
          originalAmount: Math.abs(diff),
          netAmount: diff,
          fee: 0,
          currency: acc.currency,
          description: `Reconciliation adjustment (${diff > 0 ? '+' : ''}${diff}): ${notes}`
        });
      }

      state.reconciliations.unshift({
        id: 'rec_' + Date.now(),
        accountId: acc.id,
        systemBalance: sys,
        actualBalance: actual,
        difference: diff,
        status,
        date: new Date().toISOString().slice(0, 10),
        notes
      });

      persistState();
      closeModal();
      renderApp();
      showToast(diff === 0 ? 'Account verified as Reconciled!' : 'Reconciliation adjustment posted to ledger');
    };

    window.viewAccountHistory = (accId) => {
      const acc = state.accounts.find(a => a.id === accId);
      const txns = state.ledger.filter(l => l.sourceAccountId === accId || l.destAccountId === accId);
      openModal(`${acc.name} — Ledger History`, txns.length === 0 ? '<p class="text-xs text-muted">No transactions yet.</p>' : `
        <div class="space-y-2 max-h-96 overflow-y-auto">
          ${txns.map(t => `
            <div class="p-3 rounded-xl glass-input text-xs flex justify-between items-center">
              <div>
                <div class="font-bold">${t.type} ${t.category ? '• ' + t.category : ''}</div>
                <div class="text-muted">${t.date} — ${t.description || ''}</div>
              </div>
              <div class="font-bold">${t.originalAmount} ${t.currency}</div>
            </div>
          `).join('')}
        </div>
      `);
    };

    // --- 7C. TRADING WORKSPACE ---
    function renderTrading() {
      const m = computeMetrics();
      const pnlColor = m.tradingPnlUsdt >= 0 ? 'text-emerald-500' : 'text-rose-500';
      const closedTrades = state.trading.trades.filter(t => t.status === 'CLOSED');
      const winningTrades = closedTrades.filter(t => t.realizedPnl > 0);
      const winRate = closedTrades.length > 0 ? round2((winningTrades.length / closedTrades.length) * 100) : 0;

      return `
        <!-- Top Controls & Trading Mode Toggle -->
        <div class="glass-card rounded-3xl p-5 flex flex-wrap items-center justify-between gap-4">
          <div>
            <h3 class="font-bold text-base">Cash-Flow-Adjusted Trading Engine</h3>
            <p class="text-xs text-muted">Actual PnL = Current Capital - Opening Capital - (Deposits - Withdrawals)</p>
          </div>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 text-xs font-bold cursor-pointer glass-input px-3 py-2 rounded-xl">
              <input type="checkbox" ${state.settings.tradingMode ? 'checked' : ''} onchange="toggleTradingMode(this.checked)" class="w-4 h-4 accent-emerald-500" />
              Trading Mode: ${state.settings.tradingMode ? 'ON (Journal Active)' : 'OFF (Capital Only)'}
            </label>
            <button onclick="openTradingCapitalModal()" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">Edit Capital Flows</button>
          </div>
        </div>

        <!-- Trading KPI Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="glass-card rounded-2xl p-4">
            <span class="text-xs text-muted">Opening Capital</span>
            <div class="text-xl font-extrabold mt-1">${fmtUSD(m.openingCap)}</div>
            <span class="text-[11px] text-muted">Net Flow: ${m.netExternalCashFlow >= 0 ? '+' : ''}${fmtUSD(m.netExternalCashFlow)}</span>
          </div>
          <div class="glass-card rounded-2xl p-4">
            <span class="text-xs text-muted">Current Capital</span>
            <div class="text-xl font-extrabold mt-1">${fmtUSD(m.currentTradingUsdt)}</div>
            <span class="text-[11px] text-muted">≈ ${fmtBDT(m.tradingCapitalBdt)}</span>
          </div>
          <div class="glass-card rounded-2xl p-4">
            <span class="text-xs text-muted">Adjusted Trading PnL</span>
            <div class="text-xl font-extrabold mt-1 ${pnlColor}">${m.tradingPnlUsdt >= 0 ? '+' : ''}${fmtUSD(m.tradingPnlUsdt)}</div>
            <span class="text-[11px] ${pnlColor}">${m.tradingPnlPct}% | ≈ ${fmtBDT(m.tradingPnlBdt)}</span>
          </div>
          <div class="glass-card rounded-2xl p-4">
            <span class="text-xs text-muted">Journal Win Rate</span>
            <div class="text-xl font-extrabold mt-1">${winRate}%</div>
            <span class="text-[11px] text-muted">${winningTrades.length}W / ${closedTrades.length - winningTrades.length}L (${closedTrades.length} closed)</span>
          </div>
        </div>

        <!-- Live Crypto Market Prices -->
        <div class="glass-card rounded-3xl p-5 space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-sm">Live Crypto Market Prices (Binance API + Manual Override)</h4>
            <button onclick="fetchLiveCryptoPrices()" class="glass-input px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Live</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
            ${Object.entries(state.livePrices).map(([coin, info]) => `
              <div onclick="overrideCoinPrice('${coin}')" class="glass-input p-3 rounded-2xl cursor-pointer hover:opacity-85">
                <div class="flex justify-between text-xs font-bold"><span>${coin}</span><span class="text-[10px] text-muted">${info.manual ? 'Manual' : info.updated ? 'Live' : 'Click'}</span></div>
                <div class="text-sm font-extrabold mt-1">${info.price > 0 ? '$' + Number(info.price).toLocaleString() : '—'}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Daily Trading Capital History -->
        <div class="glass-card rounded-3xl p-5 space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-sm">Daily Trading Capital History</h4>
            <button onclick="recordDailyTradingSnapshot()" class="btn-accent px-3 py-1.5 rounded-xl text-xs font-semibold">+ Log Today's Snapshot</button>
          </div>
          ${state.trading.snapshots.length === 0 ? '<p class="text-xs text-muted">No daily snapshots logged yet.</p>' : `
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left">
                <thead class="text-muted border-b border-slate-200/30"><tr><th class="py-2">Date</th><th>Closing Capital (USDT)</th><th>Daily Change</th><th>Notes</th></tr></thead>
                <tbody class="divide-y divide-slate-200/20">
                  ${state.trading.snapshots.map(s => `
                    <tr>
                      <td class="py-2 font-medium">${s.date}</td>
                      <td class="font-bold">${fmtUSD(s.capitalUsdt)}</td>
                      <td class="${s.changeUsdt >= 0 ? 'text-emerald-500' : 'text-rose-500'} font-bold">${s.changeUsdt >= 0 ? '+' : ''}${s.changeUsdt} USDT</td>
                      <td class="text-muted">${s.notes || '—'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>

        <!-- Trading Journal (Active when Trading Mode ON) -->
        ${state.settings.tradingMode ? `
          <div class="glass-card rounded-3xl p-5 space-y-4">
            <div class="flex items-center justify-between">
              <h4 class="font-bold text-sm">Complete Trading Journal</h4>
              <button onclick="openAddTradeModal()" class="btn-accent px-3 py-1.5 rounded-xl text-xs font-semibold">+ Log Trade</button>
            </div>
            ${state.trading.trades.length === 0 ? '<p class="text-xs text-muted">No trades logged yet.</p>' : `
              <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                  <thead class="text-muted border-b border-slate-200/30">
                    <tr><th class="py-2">Date</th><th>Pair</th><th>Side</th><th>Entry</th><th>Exit</th><th>Qty</th><th>Fee</th><th>Net PnL</th><th>Status</th></tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200/20">
                    ${state.trading.trades.map(t => `
                      <tr>
                        <td class="py-2">${t.date}</td>
                        <td class="font-bold">${t.pair} <span class="text-[10px] text-muted">(${t.exchange})</span></td>
                        <td class="${t.side === 'BUY' ? 'text-emerald-500' : 'text-rose-500'} font-bold">${t.side}</td>
                        <td>$${t.entryPrice}</td>
                        <td>${t.exitPrice ? '$' + t.exitPrice : '—'}</td>
                        <td>${t.qty}</td>
                        <td>$${t.fee}</td>
                        <td class="${t.realizedPnl >= 0 ? 'text-emerald-500' : 'text-rose-500'} font-bold">${t.status === 'CLOSED' ? (t.realizedPnl >= 0 ? '+' : '') + '$' + t.realizedPnl : 'Open'}</td>
                        <td><span class="px-2 py-0.5 rounded-full bg-slate-500/10">${t.status}</span></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        ` : ''}
      `;
    }

    window.toggleTradingMode = (checked) => {
      state.settings.tradingMode = checked;
      persistState();
      renderApp();
    };

    window.openTradingCapitalModal = () => {
      openModal('Trading Capital & Cash Flows (USDT)', `
        <p class="text-xs text-muted">Deposits and withdrawals are strictly separated so they never distort your trading PnL.</p>
        <div class="space-y-3">
          <div><label class="text-xs font-semibold">Original Opening Capital (USDT)</label><input id="tc-open" type="number" step="0.01" value="${state.trading.openingCapitalUsdt}" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Total Additional Deposits (USDT)</label><input id="tc-dep" type="number" step="0.01" value="${state.trading.additionalDepositsUsdt}" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Total Withdrawals (USDT)</label><input id="tc-with" type="number" step="0.01" value="${state.trading.withdrawalsUsdt}" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <button onclick="saveTradingCapitalFlows()" class="btn-accent w-full py-2.5 rounded-xl font-semibold">Save Capital Flows</button>
        </div>
      `);
    };

    window.saveTradingCapitalFlows = () => {
      state.trading.openingCapitalUsdt = round2(parseFloat(document.getElementById('tc-open').value) || 0);
      state.trading.additionalDepositsUsdt = round2(parseFloat(document.getElementById('tc-dep').value) || 0);
      state.trading.withdrawalsUsdt = round2(parseFloat(document.getElementById('tc-with').value) || 0);
      persistState();
      closeModal();
      renderApp();
      showToast('Trading capital flows updated');
    };

    window.fetchLiveCryptoPrices = async () => {
      try {
        showToast('Fetching live Binance prices...');
        const symbols = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT'];
        const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=${encodeURIComponent(JSON.stringify(symbols))}`);
        if (!res.ok) throw new Error('API unavailable');
        const data = await res.json();
        data.forEach(item => {
          const coin = item.symbol.replace('USDT', '');
          state.livePrices[coin] = { price: round2(parseFloat(item.price)), manual: false, updated: new Date().toLocaleTimeString() };
        });
        persistState();
        renderApp();
        showToast('Live crypto prices updated');
      } catch (e) {
        showToast('Live API unavailable. Click any coin to enter manual price.', 'warning');
      }
    };

    window.overrideCoinPrice = (coin) => {
      openModal(`Manual Price Override — ${coin}`, `
        <div><label class="text-xs font-semibold">Price in USD ($)</label><input id="manual-coin-price" type="number" step="0.0001" value="${state.livePrices[coin].price}" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
        <button onclick="saveManualCoinPrice('${coin}')" class="btn-accent w-full py-2.5 rounded-xl font-semibold">Save Price</button>
      `);
    };

    window.saveManualCoinPrice = (coin) => {
      const p = parseFloat(document.getElementById('manual-coin-price').value);
      if (isNaN(p) || p < 0) return showToast('Invalid price', 'error');
      state.livePrices[coin] = { price: p, manual: true, updated: new Date().toLocaleTimeString() };
      persistState();
      closeModal();
      renderApp();
    };

    window.recordDailyTradingSnapshot = () => {
      const m = computeMetrics();
      const prev = state.trading.snapshots[0]?.capitalUsdt ?? m.openingCap;
      const change = round2(m.currentTradingUsdt - prev);
      state.trading.snapshots.unshift({
        id: 'snap_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        capitalUsdt: m.currentTradingUsdt,
        changeUsdt: change,
        notes: 'Daily closing snapshot'
      });
      persistState();
      renderApp();
      showToast('Daily trading snapshot saved');
    };

    window.openAddTradeModal = () => {
      openModal('Log Trade in Journal', `
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold">Exchange</label><input id="tr-ex" value="Binance" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Pair</label><input id="tr-pair" placeholder="BTC/USDT" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Side</label><select id="tr-side" class="glass-input w-full px-3 py-2 rounded-xl mt-1"><option value="BUY">BUY / LONG</option><option value="SELL">SELL / SHORT</option></select></div>
          <div><label class="text-xs font-semibold">Status</label><select id="tr-status" class="glass-input w-full px-3 py-2 rounded-xl mt-1"><option value="CLOSED">CLOSED</option><option value="OPEN">OPEN</option></select></div>
          <div><label class="text-xs font-semibold">Entry Price ($)</label><input id="tr-entry" type="number" step="any" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Exit Price ($)</label><input id="tr-exit" type="number" step="any" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Quantity</label><input id="tr-qty" type="number" step="any" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
          <div><label class="text-xs font-semibold">Trading Fee ($)</label><input id="tr-fee" type="number" step="any" value="0" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
        </div>
        <button onclick="saveTradeEntry()" class="btn-accent w-full py-2.5 rounded-xl font-semibold mt-2">Save Trade</button>
      `);
    };

    window.saveTradeEntry = () => {
      const exchange = document.getElementById('tr-ex').value.trim();
      const pair = document.getElementById('tr-pair').value.trim().toUpperCase();
      const side = document.getElementById('tr-side').value;
      const status = document.getElementById('tr-status').value;
      const entryPrice = parseFloat(document.getElementById('tr-entry').value) || 0;
      const exitPrice = parseFloat(document.getElementById('tr-exit').value) || 0;
      const qty = parseFloat(document.getElementById('tr-qty').value) || 0;
      const fee = parseFloat(document.getElementById('tr-fee').value) || 0;
      if (!pair || !entryPrice || !qty) return showToast('Fill pair, entry price, and quantity', 'error');

      let realizedPnl = 0;
      if (status === 'CLOSED' && exitPrice > 0) {
        const raw = side === 'BUY' ? (exitPrice - entryPrice) * qty : (entryPrice - exitPrice) * qty;
        realizedPnl = round2(raw - fee);
      }

      state.trading.trades.unshift({
        id: 'tr_' + Date.now(),
        date: new Date().toISOString().slice(0, 10),
        exchange, pair, side, status, entryPrice, exitPrice, qty, fee, realizedPnl
      });
      persistState();
      closeModal();
      renderApp();
      showToast('Trade logged to journal');
    };

    // --- 7D. INCOME & PENDING INCOME ---
    function renderIncome() {
      const accOpts = state.accounts.map(a => `<option value="${a.id}">${a.name} (${a.currency})</option>`).join('');
      const catOpts = state.incomeCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      const incomes = state.ledger.filter(l => l.type === 'INCOME');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Add Confirmed Income -->
          <div class="glass-card rounded-3xl p-6 space-y-3">
            <h3 class="font-bold text-base">Record Confirmed Income</h3>
            <div class="grid grid-cols-2 gap-3">
              <div class="col-span-2"><label class="text-xs font-semibold">Title / Source</label><input id="inc-title" class="glass-input w-full px-3 py-2 rounded-xl mt-1" placeholder="e.g., Binance Airdrop / Client Payment" /></div>
              <div><label class="text-xs font-semibold">Category</label><select id="inc-cat" class="glass-input w-full px-3 py-2 rounded-xl mt-1">${catOpts}</select></div>
              <div><label class="text-xs font-semibold">Receiving Account</label><select id="inc-acc" class="glass-input w-full px-3 py-2 rounded-xl mt-1">${accOpts}</select></div>
              <div><label class="text-xs font-semibold">Gross Amount</label><input id="inc-amt" type="number" step="0.01" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
              <div><label class="text-xs font-semibold">Fee (if any)</label><input id="inc-fee" type="number" step="0.01" value="0" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
            </div>
            <button onclick="postIncome()" class="btn-accent w-full py-2.5 rounded-xl font-semibold">Credit Account & Save</button>
          </div>

          <!-- Pending Income -->
          <div class="glass-card rounded-3xl p-6 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-base">Pending Income (Unclaimed)</h3>
              <button onclick="openAddPendingModal()" class="glass-input px-3 py-1.5 rounded-xl text-xs font-semibold">+ Add Pending</button>
            </div>
            <p class="text-xs text-muted">Excluded from Solid Cash & Net Worth until confirmed received.</p>
            <div class="space-y-2 max-h-64 overflow-y-auto">
              ${state.pendingIncomes.length === 0 ? '<p class="text-xs text-muted">No pending incomes.</p>' : state.pendingIncomes.map(p => `
                <div class="p-3 rounded-2xl glass-input flex items-center justify-between gap-2 text-xs">
                  <div>
                    <div class="font-bold">${p.title} <span class="text-muted">(${p.category})</span></div>
                    <div class="text-muted">${p.amount} ${p.currency} • Expected: ${p.expectedDate || 'TBD'}</div>
                  </div>
                  ${p.status === 'PENDING'
                    ? `<button onclick="openConfirmPendingModal('${p.id}')" class="btn-accent px-3 py-1.5 rounded-xl font-semibold shrink-0">Confirm</button>`
                    : `<span class="px-2 py-1 rounded-full bg-emerald-500/15 text-emerald-600 font-bold">Received</span>`}
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- Recent Income History -->
        <div class="glass-card rounded-3xl p-6 space-y-3">
          <h3 class="font-bold text-base">Confirmed Income History</h3>
          ${incomes.length === 0 ? '<p class="text-xs text-muted">No income recorded yet.</p>' : `
            <div class="space-y-2">
              ${incomes.slice(0, 15).map(i => `
                <div class="p-3 rounded-2xl glass-input flex justify-between items-center text-xs">
                  <div><span class="font-bold">${i.description}</span> <span class="text-muted">• ${i.category} • ${i.date}</span></div>
                  <div class="font-bold text-emerald-500">+${fmtCurrency(i.netAmount, i.currency)}</div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    window.postIncome = () => {
      const title = document.getElementById('inc-title').value.trim();
      const category = document.getElementById('inc-cat').value;
      const accId = document.getElementById('inc-acc').value;
      const amt = parseFloat(document.getElementById('inc-amt').value) || 0;
      const fee = parseFloat(document.getElementById('inc-fee').value) || 0;
      const acc = state.accounts.find(a => a.id === accId);
      if (!title || amt <= 0 || !acc) return showToast('Fill title and valid amount', 'error');

      const net = round2(amt - fee);
      acc.balance = round2(acc.balance + net);
      addLedgerRecord({ type: 'INCOME', destAccountId: acc.id, originalAmount: amt, fee, netAmount: net, currency: acc.currency, category, description: title });
      persistState();
      renderApp();

            </div>
            <button onclick="postTransfer()" class="btn-accent w-full py-2.5 rounded-xl font-semibold">Execute Transfer</button>
          </div>

            <h3 class="font-bold text-base">Binance P2P Sell (USDT → BDT)</h3>
            <p class="text-xs text-muted">Uses exact P2P rate. Deducts USDT, credits net BDT after fees.</p>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="text-xs font-semibold">Source USDT Wallet</label><select id="p2p-src" class="glass-input w-full px-3 py-2 rounded-xl mt-1">${usdtAccs}</select></div>

              <div><label class="text-xs font-semibold">USDT Amount</label><input id="p2p-usdt" type="number" step="0.01" class="glass-input w-full px-3 py-2 rounded-xl mt-1" placeholder="100" /></div>
              <div><label class="text-xs font-semibold">Actual P2P Rate (৳)</label><input id="p2p-rate" type="number" step="0.01" value="${state.settings.usdToBdtRate}" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
              <div class="col-span-2"><label class="text-xs font-semibold">P2P / Cashout Fee (৳)</label><input id="p2p-fee" type="number" step="0.01" value="0" class="glass-input w-full px-3 py-2 rounded-xl mt-1" /></div>
            </div>
            <button onclick="postP2PSell()" class="btn-accent w-full py-2.5 rounded-xl font-semibold">Execute P2P Sell</button>
          </div>
        </div>
      `;
    }

    window.postTransfer = () => {
      const src = state.accounts.find(a => a.id === document.getElementById('tf-src').value);
      const dst = state.accounts.find(a => a.id === document.getElementById('tf-dst').value);
      const amt = parseFloat(document.getElementById('tf-amt').value) || 0;
      const fee = parseFloat(document.getElementById('tf-fee').value) || 0;
      if (!src || !dst || src.id === dst.id || amt <= 0) return showToast('Select two different accounts and valid amount', 'error');
      if (src.currency !== dst.currency) return showToast('Use P2P form for cross-currency transfers', 'warning');

      src.balance = round2(src.balance - (amt + fee));
      dst.balance = round2(dst.balance + amt);
      addLedgerRecord({ type: 'TRANSFER', sourceAccountId: src.id, destAccountId: dst.id, originalAmount: amt, fee, netAmount: amt, currency: src.currency, description: `${src.name} → ${dst.name}` });
      persistState();
      renderApp();
      showToast('Transfer completed');
    };

    window.postP2PSell = () => {
      const src = state.accounts.find(a => a.id === document.getElementById('p2p-src').value);
      const dst = state.accounts.find(a => a.id === document.getElementById('p2p-dst').value);
      const usdt = parseFloat(document.getElementById('p2p-usdt').value) || 0;
      const rate = parseFloat(document.getElementById('p2p-rate').value) || 0;
      const feeBdt = parseFloat(document.getElementById('p2p-fee').value) || 0;
      if (!src || !dst || usdt <= 0 || rate <= 0) return showToast('Enter valid USDT amount and rate', 'error');

      const grossBdt = round2(usdt * rate);
      const netBdt = round2(grossBdt - feeBdt);
      src.balance = round2(src.balance - usdt);
      dst.balance = round2(dst.balance + netBdt);

      // Update trading withdrawals so P2P cash-out is not miscounted as trading loss
      if (src.type === 'TRADING') {
        state.trading.withdrawalsUsdt = round2(state.trading.withdrawalsUsdt + usdt);
      }

      addLedgerRecord({
        type: 'P2P_SELL', sourceAccountId: src.id, destAccountId: dst.id,
        originalAmount: usdt, currency: 'USDT', exchangeRate: rate,
        convertedAmount: grossBdt, fee: feeBdt, netAmount: netBdt,
        description: `P2P Sell ${usdt} USDT @ ৳${rate} → ${dst.name} (Net ৳${netBdt})`
      });
      persistState();
      renderApp();
      showToast(`P2P Sell complete: Credited ৳${netBdt} to ${dst.name}`);
    };

      if (l.type === 'RECEIVABLE') acc.balance = round2(acc.balance + amt);
      else acc.balance = round2(acc.balance - amt);

      addLedgerRecord({ type: l.type === 'RECEIVABLE' ? 'LOAN_REPAYMENT' : 'DEBT_PAYMENT', originalAmount: amt, netAmount: amt, fee: 0, currency: 'BDT', description: `Repayment with ${l.person}` });

          type: 'doughnut',
          data: {
            labels: ['Solid Cash', 'Trading Capital', 'Hard Assets', 'Investments', 'Receivables'],
            datasets: [{
              data: [m.solidCashBdt, m.tradingCapitalBdt, m.ownedHardAssetsBdt, m.activeInvestmentsBdt, m.receivablesBdt],

              borderWidth: 0
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      const expMap = {};
      state.ledger.filter(l => l.type === 'EXPENSE').forEach(e => {
        const cat = e.category || 'Others';
        expMap[cat] = (expMap[cat] || 0) + Number(e.originalAmount);
      });
      const ctxExp = document.getElementById('chart-expenses');
      if (ctxExp) {
        chartInstances.exp = new Chart(ctxExp, {
          type: 'bar',
          data: {
            labels: Object.keys(expMap).length ? Object.keys(expMap) : ['No Expenses'],
            datasets: [{
              label: 'Amount',
              data: Object.values(expMap).length ? Object.values(expMap) : [0],

              borderRadius: 8

          options: { responsive: true, maintainAspectRatio: false }

    window.exportLedgerCSV = () => {
      const headers = ['ID', 'Date', 'Type', 'Category', 'Amount', 'Fee', 'Net', 'Currency', 'Description'];

      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');

    function renderAI() {
      return `

          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-200/30">

            `).join('')}

            <button onclick="askAI('Am I spending more than I earn this month?')" class="glass-input px-3 py-1.5 rounded-full shrink-0">Spending Check</button>
          </div>

          <!-- Input Box -->
          <div class="flex gap-2 pt-2 border-t border-slate-200/30">
            <input id="ai-input" onkeydown="if(event.key==='Enter') sendAIMessage()" class="glass-input flex-1 px-4 py-2.5 rounded-2xl text-sm" placeholder="Ask your financial advisor..." />
            <button onclick="sendAIMessage()" id="ai-send-btn" class="btn-accent px-5 py-2.5 rounded-2xl text-sm font-semibold">Send</button>
          </div>
        </div>
      `;
    }

    window.setAiLang = (lang) => { state.settings.aiLanguage = lang; persistState(); };
    window.askAI = (q) => { document.getElementById('ai-input').value = q; sendAIMessage(); };

    window.sendAIMessage = async () => {
      const input = document.getElementById('ai-input');
      const query = input.value.trim();
      if (!query) return;
      input.value = '';

      state.aiChat.push({ role: 'user', text: query, time: new Date().toLocaleTimeString() });
      renderApp();
      const msgBox = document.getElementById('ai-messages');
      msgBox.scrollTop = msgBox.scrollHeight;

      const m = computeMetrics();
      const financialContext = JSON.stringify({
        metrics: m,
        accounts: state.accounts.map(a => ({ name: a.name, type: a.type, currency: a.currency, balance: a.balance })),
        loans: state.loans,
        hardAssetsOwned: state.hardAssets.filter(a => a.status === 'OWNED'),
        recentLedger: state.ledger.slice(0, 15)
      });

      const systemPrompt = `You are NetWorth RQ's strict, friendly, and direct personal financial advisor.
Respond in ${state.settings.aiLanguage.toUpperCase()}.
CRITICAL RULE: Base every number strictly on the provided JSON financial state. Never invent or hallucinate financial data. If a value is 0, say it is 0.
USER FINANCIAL STATE: ${financialContext}`;

      const apiKey = state.settings.customGeminiKey || "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      let reply = 'Unable to reach AI service. If running offline outside Canvas, add your Gemini API Key in Settings.';
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: query }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) { reply = text; break; }
        } catch (err) {
          await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
        }
      }

      state.aiChat.push({ role: 'assistant', text: reply, time: new Date().toLocaleTimeString() });
      persistState();
      renderApp();
      const box2 = document.getElementById('ai-messages');
      if (box2) box2.scrollTop = box2.scrollHeight;
    };

          <div class="glass-card rounded-3xl p-6 space-y-3">
            <h3 class="font-bold text-base">Visual Theme (Glassmorphism)</h3>
            <div class="grid grid-cols-3 gap-2.5 text-xs">
              <button onclick="setTheme('pure_white')" class="p-3 rounded-2xl border ${state.settings.theme === 'pure_white' ? 'border-slate-900 font-bold' : 'border-slate-200'} bg-white text-slate-900">Pure White</button>
              <button onclick="setTheme('warm_neon')" class="p-3 rounded-2xl border ${state.settings.theme === 'warm_neon' ? 'border-orange-500 font-bold' : 'border-amber-200'} bg-amber-50 text-orange-600">Warm Neon</button>
              <button onclick="setTheme('dark_glass')" class="p-3 rounded-2xl border ${state.settings.theme === 'dark_glass' ? 'border-sky-400 font-bold' : 'border-slate-700'} bg-slate-900 text-sky-400">Dark Glass</button>
            </div>
          </div>

          <!-- PIN Lock & Privacy -->
          <div class="glass-card rounded-3xl p-6 space-y-3">
            <h3 class="font-bold text-base">Security & PIN Lock</h3>
            <div class="flex gap-2">
              <input id="set-pin-input" type="password" maxlength="6" value="${state.settings.pin}" placeholder="Set 4-6 digit PIN" class="glass-input flex-1 px-3 py-2 rounded-xl text-sm" />
              <button onclick="savePinSetting()" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">Save PIN</button>
            </div>
            <p class="text-xs text-muted">Leave empty and click Save to disable PIN lock.</p>
          </div>

          <!-- JSON Backup & Restore -->
          <div class="glass-card rounded-3xl p-6 space-y-3">
            <h3 class="font-bold text-base">JSON Backup & Restore</h3>
            <p class="text-xs text-muted">Download a complete snapshot of your NetWorth RQ vault or restore from a backup file.</p>
            <div class="flex flex-wrap gap-2">
              <button onclick="exportJSONBackup()" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">Download JSON Backup</button>
              <label class="glass-input px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">
                Restore JSON File
                <input type="file" accept=".json" onchange="importJSONBackup(event)" class="hidden" />
              </label>
            </div>
          </div>

          <!-- Optional Gemini API Key for Offline Use -->
          <div class="glass-card rounded-3xl p-6 space-y-3">
            <h3 class="font-bold text-base">AI Agent API Key (Optional)</h3>
            <p class="text-xs text-muted">Only needed if you download this HTML file and run it locally outside Canvas.</p>
            <div class="flex gap-2">
              <input id="custom-gemini-key" type="password" value="${state.settings.customGeminiKey || ''}" placeholder="AIza..." class="glass-input flex-1 px-3 py-2 rounded-xl text-sm" />
              <button onclick="saveCustomGeminiKey()" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">Save</button>
            </div>
          </div>
        </div>
      `;
    }

    window.setTheme = (t) => { applyTheme(t); renderApp(); };

    window.savePinSetting = () => {
      const pin = document.getElementById('set-pin-input').value.trim();
      state.settings.pin = pin;
      document.getElementById('header-lock-btn').classList.toggle('hidden', !pin);
      persistState();
      showToast(pin ? 'PIN lock enabled' : 'PIN lock disabled');
    };

    window.saveCustomGeminiKey = () => {
      state.settings.customGeminiKey = document.getElementById('custom-gemini-key').value.trim();
      persistState();
      showToast('API key saved');
    };

    window.exportJSONBackup = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `NetWorth_RQ_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      showToast('Backup downloaded');
    };

    window.importJSONBackup = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.accounts || !parsed.settings) throw new Error('Invalid backup file');
          state = { ...createInitialState(), ...parsed };
          applyTheme(state.settings.theme);
          persistState();
          renderApp();
          showToast('Vault restored successfully');
        } catch (err) {
          showToast('Invalid JSON backup file', 'error');
        }
      };
      reader.readAsText(file);
    };

    // =========================================================================
    // 8. BOOTSTRAP APPLICATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      initCloudPersistence();
    });
  </script>
</body>
</html>
